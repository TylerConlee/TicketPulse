root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp", "vendor", "node_modules", ".git"]
  delay = 500

[proxy]
  enabled = true
  proxy_port = 8090
  app_port = 8080

[log]
  time = false

[misc]
  clean_on_exit = true
