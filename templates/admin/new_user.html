{{define "content"}}
<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
    <div class="px-6 py-4 border-b border-gray-100">
      <h3 class="text-sm font-semibold text-gray-900">Create New User</h3>
      <p class="text-xs text-gray-500 mt-1">Fill in the details to create a new user account.</p>
    </div>
    <div class="p-6">
      <form method="POST" action="/admin/users/new" class="space-y-4">
        {{.CSRFField}}
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" name="email" placeholder="user@example.com" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          <input type="text" id="name" name="name" placeholder="Full Name" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>
        <div>
          <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
          <select id="role" name="role" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none bg-white">
            <option value="" disabled selected>Select Role</option>
            <option value="admin">Admin</option>
            <option value="agent">Agent</option>
          </select>
        </div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="daily_summary" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
          <span class="text-sm text-gray-700">Enable Daily Summary</span>
        </label>
        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="inline-flex items-center px-4 py-2 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors">Create User</button>
          <a href="/admin/users" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{{end}}
