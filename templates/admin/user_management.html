{{define "content"}}
<div class="bg-white rounded-xl border border-gray-200 shadow-sm">
  <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
    <h3 class="text-sm font-semibold text-gray-900">Users</h3>
    <a href="/admin/users/new" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      New User
    </a>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100">
          <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
          <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Name</th>
          <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Email</th>
          <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Role</th>
          <th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        {{range .Users}}
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-3 text-gray-500 tabular-nums">{{.ID}}</td>
          <td class="px-6 py-3 font-medium text-gray-900">{{.Name}}</td>
          <td class="px-6 py-3 text-gray-600">{{.Email}}</td>
          <td class="px-6 py-3">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium {{if eq .Role "admin"}}bg-purple-50 text-purple-700{{else}}bg-gray-100 text-gray-700{{end}}">{{.Role}}</span>
          </td>
          <td class="px-6 py-3 text-right">
            <div class="flex items-center justify-end gap-2">
              <a href="/admin/users/edit/{{.ID}}" class="text-brand-600 hover:text-brand-800 text-sm font-medium transition-colors">Edit</a>
              <form action="/admin/users/delete/{{.ID}}" method="POST" class="inline delete-confirm-form">
                {{$.CSRFField}}
                <button type="submit" class="text-red-600 hover:text-red-800 text-sm font-medium transition-colors">Delete</button>
              </form>
            </div>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
<script nonce="{{$.CSPNonce}}">
document.querySelectorAll('.delete-confirm-form').forEach(function(form) {
  form.addEventListener('submit', function(e) {
    if (!confirm('Are you sure you want to delete this user?')) e.preventDefault();
  });
});
</script>
{{end}}
