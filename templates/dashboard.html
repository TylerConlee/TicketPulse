{{define "content"}}
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <!-- New Ticket Alerts -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
    <div class="px-6 py-4 border-b border-gray-100">
      <h3 class="text-sm font-semibold text-gray-900">New Ticket Alerts</h3>
    </div>
    <div class="p-6">
      {{if .HasNewTicketData}}
      <canvas id="newTicketChart" class="w-full" height="220"></canvas>
      {{else}}
      <div class="flex items-center gap-3 p-4 bg-amber-50 text-amber-800 rounded-lg text-sm">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        No data available yet.
      </div>
      {{end}}
    </div>
  </div>

  <!-- Ticket Update Alerts -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
    <div class="px-6 py-4 border-b border-gray-100">
      <h3 class="text-sm font-semibold text-gray-900">Ticket Update Alerts</h3>
    </div>
    <div class="p-6">
      {{if .HasTicketUpdateData}}
      <canvas id="ticketUpdateChart" class="w-full" height="220"></canvas>
      {{else}}
      <div class="flex items-center gap-3 p-4 bg-amber-50 text-amber-800 rounded-lg text-sm">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        No data available yet.
      </div>
      {{end}}
    </div>
  </div>

  <!-- SLA Deadline Alerts -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
    <div class="px-6 py-4 border-b border-gray-100">
      <h3 class="text-sm font-semibold text-gray-900">SLA Deadline Alerts</h3>
    </div>
    <div class="p-6">
      {{if .HasSlaDeadlineData}}
      <canvas id="slaDeadlineChart" class="w-full" height="220"></canvas>
      {{else}}
      <div class="flex items-center gap-3 p-4 bg-amber-50 text-amber-800 rounded-lg text-sm">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        No data available yet.
      </div>
      {{end}}
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const chartOptions = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16, font: { size: 12 } } } },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 11 } } },
      y: { beginAtZero: true, ticks: { font: { size: 11 }, stepSize: 1 } }
    }
  };

  function initChart(canvasId, rawData) {
    const el = document.getElementById(canvasId);
    if (!el) return;
    const data = JSON.parse(rawData);
    new Chart(el.getContext('2d'), { type: 'line', data: data, options: chartOptions });
  }

  initChart('newTicketChart', '{{.NewTicketData}}');
  initChart('ticketUpdateChart', '{{.TicketUpdateData}}');
  initChart('slaDeadlineChart', '{{.SlaDeadlineData}}');
</script>
{{end}}
